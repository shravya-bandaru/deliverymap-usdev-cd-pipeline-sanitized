# =============================================================================
# dast-scan.yml — Main GitHub Actions workflow
# Equivalent of: DAST-Scan.yaml (ADO pipeline)
#
# Entry point for the DAST scanning pipeline. Runs a Netsparker (Invicti)
# security scan against the configured target website.
#
# Architecture (mirrors ADO template hierarchy):
#   dast-scan.yml (workflow)
#     → .github/actions/scan-netsparker (composite action)
#       → .github/actions/scan-base (composite action)
#
# Triggers:
#   - Scheduled: Daily at 10 PM UTC on main branch
#   - Manual: workflow_dispatch with environment selection
# =============================================================================

name: DAST Scan (Netsparker)

on:
  # ---- Scheduled trigger (daily at 10 PM UTC) ----
  schedule:
    - cron: "0 22 * * *"

  push:
    branches:
      - dastscan

  # ---- Manual trigger with environment selection ----
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: choice
        default: "us-int"
        options:
          - us-dev
          - us-qa
          - us-perf
          - us-int
          - us-stage
          - apac-stage
          - emea-stage

env:
  ENVIRONMENT: ${{ github.event.inputs.environment || 'us-int' }}

jobs:
  dast-scan:
    name: netsparker
    runs-on: ubuntu-latest
    timeout-minutes: 480

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Netsparker DAST Scan
        uses: ./.github/actions/scan-netsparker
        with:
          netsparker-endpoint: ${{ vars.NETSPARKER_ENDPOINT }}
          netsparker-website-id: ${{ vars.NETSPARKER_WEBSITE_ID }}
          netsparker-profile-id: ${{ vars.NETSPARKER_PROFILE_ID }}
          netsparker-user-id: ${{ secrets.NETSPARKER_USER_ID }}
          netsparker-api-token: ${{ secrets.NETSPARKER_API_TOKEN }}
          scan-type: "FullWithSelectedProfile"
          severity: "DoNotFail"
          download-artifacts: "false"
