# =============================================================================
# dast-scan.yml — Main GitHub Actions workflow
# Equivalent of: DAST-Scan.yaml (ADO pipeline)
#
# Entry point for the DAST scanning pipeline. Runs a Netsparker (Invicti)
# security scan against the configured target website.
#
# Triggers:
#   - Scheduled: Daily at 10 PM UTC on main branch
#   - Manual: workflow_dispatch with environment selection
#
# Original ADO pipeline used:
#   - Pool: dds-concourse-ubuntu2004-01
#   - Variable groups: infra-devops-secrets, ConcourseCore, us-int
#   - Task: netsparker-cloud@1
# =============================================================================

name: DAST Scan (Netsparker)

on:
  # ---- Scheduled trigger (daily at 10 PM UTC) ----
  # Mirrors: schedules > cron: "0 22 * * *" from ADO
  schedule:
    - cron: "0 22 * * *"

  # ---- Manual trigger with environment selection ----
  # Mirrors: parameters > ENVIRONMENT from ADO
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: choice
        default: "us-int"
        options:
          - us-dev
          - us-qa
          - us-perf
          - us-int
          - us-stage
          - apac-stage
          - emea-stage

# Environment variables — replaces ADO variable groups
# (infra-devops-secrets, ConcourseCore, us-int)
# These are sourced from GitHub Secrets/Variables configured at the repo level.
env:
  ENVIRONMENT: ${{ github.event.inputs.environment || 'us-int' }}

jobs:
  dast-scan:
    uses: ./.github/workflows/scan-netsparker.yml
    with:
      job-name: "netsparker"
      timeout-minutes: 480
      download-artifacts: false
      netsparker-endpoint: ${{ vars.NETSPARKER_ENDPOINT }}
      netsparker-website-id: ${{ vars.NETSPARKER_WEBSITE_ID }}
      netsparker-profile-id: ${{ vars.NETSPARKER_PROFILE_ID }}
      scan-type: "FullWithSelectedProfile"
      severity: "DoNotFail"
      stop-scan: "true"
    secrets:
      NETSPARKER_USER_ID: ${{ secrets.NETSPARKER_USER_ID }}
      NETSPARKER_API_TOKEN: ${{ secrets.NETSPARKER_API_TOKEN }}
