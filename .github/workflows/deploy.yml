# =============================================================================
# GitHub Actions equivalent of:
#   ConcourseCore/deploy/monorepo-targeted-deploy-with-secrets.yaml (Azure DevOps)
#
# Trigger: Manual (workflow_dispatch) — same as ADO "trigger: none"
# Strategy: Matrix job iterating over services.json (replaces ADO ${{ each service }})
# =============================================================================

name: Deploy Concourse Microservices

on:
  workflow_dispatch:
    inputs:
      ENVIRONMENT:
        description: "Target environment"
        required: true
        default: "us-dev"
        type: choice
        options:
          - us-dev
          - us-qa
          - us-perf
          - us-int
          - us-stage
          - us-prod
          - us-prod-dr
          - emea-stage
          - emea-prod
          - emea-prod-dr
          - apac-stage
          - apac-prod
          - apac-prod-dr

      ASB_QUEUE_SUFFIX:
        description: "ASB Queue Suffix"
        required: false
        default: " "
        type: choice
        options:
          - " "
          - "-2"

      EVENTHUB_CONSUMER_GROUP:
        description: "EventHub Consumer Group"
        required: false
        default: "ConsumerGroup1"
        type: choice
        options:
          - ConsumerGroup1
          - ConsumerGroup2

      RELEASE_LABEL:
        description: "Release label (for stage/prod canary deployments)"
        required: false
        default: ""

      promoteFromDev:
        description: "Promote build IDs from dev health endpoint"
        required: false
        type: boolean
        default: false

      RESTART_PODS:
        description: "Rolling restart deployments after deploy"
        required: false
        type: boolean
        default: false

# ---------------------------------------------------------------------------
# Global environment variables (replaces ADO 'variables:' block)
# ADO variable groups (ConcourseCore, $ENVIRONMENT) must be migrated to
# GitHub Actions Environment secrets / variables or org-level secrets.
# ---------------------------------------------------------------------------
env:
  ENVIRONMENT: ${{ inputs.ENVIRONMENT }}
  MESH_K8S_NAMESPACE: co-mesh
  ASB_QUEUE_SUFFIX: ${{ inputs.ASB_QUEUE_SUFFIX }}
  RELEASE_LABEL: ${{ inputs.RELEASE_LABEL }}
  REPLICAS: "1"

jobs:
  # ===========================================================================
  # Job 1 — Build the dynamic matrix from services.json
  # ===========================================================================
  setup-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build service matrix from services.json
        id: set-matrix
        run: |
          MATRIX=$(cat services.json | jq -c '.')
          echo "matrix={\"service\":$MATRIX}" >> "$GITHUB_OUTPUT"

  # ===========================================================================
  # Job 2 — Deploy each service (replaces ADO "${{ each service }}" loop)
  # ===========================================================================
  deploy-service:
    needs: setup-matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix: ${{ fromJson(needs.setup-matrix.outputs.matrix) }}

    # -------------------------------------------------------------------------
    # Per-job environment — uses the GitHub Actions Environment matching the
    # target region. Secrets like K8S_SERVICE_CONNECTION, AZURE_SERVICE_CONNECTION,
    # AZ_KEY_VAULT, WAYDEV_API_HOST, WAYDEV_API_KEY must be stored there.
    # -------------------------------------------------------------------------
    environment: ${{ inputs.ENVIRONMENT }}

    env:
      SERVICE_NAME: ${{ matrix.service.name }}
      ver: ${{ matrix.service.buildId }}

    steps:
      # -----------------------------------------------------------------------
      # 1. Checkout repository (all folders are in the same repo)
      # -----------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # -----------------------------------------------------------------------
      # 2. Resolve config branches (replaces ADO "Validate & Set Branch Targets")
      # -----------------------------------------------------------------------
      - name: Resolve config branches
        id: branches
        run: |
          CONFIG_BRANCH="${{ matrix.service.configBranch }}"
          TECH_BRANCH="${{ matrix.service.techEnablementConfigBranch }}"
          CORE_BRANCH="${{ matrix.service.concourseCoreConfigBranch }}"

          if [ -n "$CONFIG_BRANCH" ]; then
            echo "techEnablementConfigBranch=$CONFIG_BRANCH" >> "$GITHUB_ENV"
            echo "concourseCoreConfigBranch=$CONFIG_BRANCH"  >> "$GITHUB_ENV"
          elif [ -n "$TECH_BRANCH" ] && [ -n "$CORE_BRANCH" ]; then
            echo "techEnablementConfigBranch=$TECH_BRANCH" >> "$GITHUB_ENV"
            echo "concourseCoreConfigBranch=$CORE_BRANCH"  >> "$GITHUB_ENV"
          elif [ -n "$TECH_BRANCH" ]; then
            echo "techEnablementConfigBranch=$TECH_BRANCH" >> "$GITHUB_ENV"
            echo "concourseCoreConfigBranch=develop"        >> "$GITHUB_ENV"
          elif [ -n "$CORE_BRANCH" ]; then
            echo "techEnablementConfigBranch=main"          >> "$GITHUB_ENV"
            echo "concourseCoreConfigBranch=$CORE_BRANCH"   >> "$GITHUB_ENV"
          else
            echo "::error::No config branch set for ${{ matrix.service.name }}"
            exit 1
          fi

      # -----------------------------------------------------------------------
      # 3. Switch ConcourseCore branch (kube config)
      # -----------------------------------------------------------------------
      - name: Switch ConcourseCore branch (if needed)
        working-directory: ConcourseCore
        run: |
          git fetch --all
          git checkout "${{ env.concourseCoreConfigBranch }}" || echo "Using current branch"

      # -----------------------------------------------------------------------
      # 4. Switch Tech-Enablement branch (if needed)
      # -----------------------------------------------------------------------
      - name: Switch Tech-Enablement branch (if needed)
        working-directory: tech-enablement
        run: |
          git fetch --all
          git switch "${{ env.techEnablementConfigBranch }}" || echo "Using current branch"

      # -----------------------------------------------------------------------
      # 5. Compute K8S naming variables (replaces ADO compile-time expressions)
      # -----------------------------------------------------------------------
      - name: Compute K8S naming variables
        run: |
          ENV="${{ inputs.ENVIRONMENT }}"
          RELEASE_LABEL="${{ inputs.RELEASE_LABEL }}"
          K8S_SUFFIX=$(echo "$RELEASE_LABEL" | tr '[:upper:]' '[:lower:]' | tr '.' '-')
          SVC="${{ matrix.service.name }}"

          HIGHER_ENVS=("us-stage" "us-prod" "emea-stage" "emea-prod" "apac-stage" "apac-prod")
          IS_HIGHER=false
          for e in "${HIGHER_ENVS[@]}"; do
            [[ "$ENV" == "$e" ]] && IS_HIGHER=true
          done

          if [ "$IS_HIGHER" = true ] && [ -n "$K8S_SUFFIX" ]; then
            echo "CONFIGMAP_NAME=${SVC}-${K8S_SUFFIX}-configmap"     >> "$GITHUB_ENV"
            echo "DEPLOYMENT_NAME=${SVC}-${K8S_SUFFIX}"              >> "$GITHUB_ENV"
            echo "SECRETMAP_NAME=${SVC}-${K8S_SUFFIX}-secretmap"     >> "$GITHUB_ENV"
            echo "CONFIGMAP_YAML_NAME=${SVC}-${K8S_SUFFIX}-yaml"     >> "$GITHUB_ENV"
            echo "SERVICE_HOST_SUFFIX=-${K8S_SUFFIX}"                >> "$GITHUB_ENV"
            echo "K8S_RELEASE_LABEL=release: ${RELEASE_LABEL}"       >> "$GITHUB_ENV"
          else
            echo "CONFIGMAP_NAME=${SVC}-configmap"       >> "$GITHUB_ENV"
            echo "DEPLOYMENT_NAME=${SVC}"                >> "$GITHUB_ENV"
            echo "SECRETMAP_NAME=${SVC}-secretmap"       >> "$GITHUB_ENV"
            echo "CONFIGMAP_YAML_NAME=${SVC}-yaml"       >> "$GITHUB_ENV"
            echo "SERVICE_HOST_SUFFIX= "                 >> "$GITHUB_ENV"
            echo "K8S_RELEASE_LABEL= "                   >> "$GITHUB_ENV"
          fi

          echo "K8S_SUFFIX=$K8S_SUFFIX"                  >> "$GITHUB_ENV"
          echo "K8S_NAMESPACE_MESH=co-mesh"              >> "$GITHUB_ENV"

          # EventHub consumer group
          if [ "$IS_HIGHER" = true ]; then
            echo "EVENTHUB_CONSUMER_GROUP=${{ inputs.EVENTHUB_CONSUMER_GROUP }}" >> "$GITHUB_ENV"
          else
            echo 'EVENTHUB_CONSUMER_GROUP=$Default' >> "$GITHUB_ENV"
          fi

      # -----------------------------------------------------------------------
      # 6. Promote build ID from dev (optional)
      # -----------------------------------------------------------------------
      - name: Get versions from dev (promote)
        if: ${{ inputs.promoteFromDev == true }}
        run: |
          BUILD_ID_RESPONSE=$(curl -s "https://concourse-api-qa.pwc.com/v3/${{ matrix.service.contextPath }}/health")
          BUILD_ID=$(echo "$BUILD_ID_RESPONSE" | jq -r '.metadata.appVersion' | sed 's/.202/-202/g')
          echo "ver=${BUILD_ID}" >> "$GITHUB_ENV"

      # -----------------------------------------------------------------------
      # 7. Copy manifest templates
      # -----------------------------------------------------------------------
      - name: Copy manifest templates
        run: |
          cp -v ConcourseCore/k8s/microservice-template/service.yaml \
                ConcourseCore/k8s/${{ matrix.service.name }}/service.yaml

      # -----------------------------------------------------------------------
      # 8. Update SERVICE_HOST for higher environments
      # -----------------------------------------------------------------------
      - name: Update SERVICE_HOST suffixes (higher envs only)
        if: >-
          contains(fromJson('["us-stage","us-prod","emea-stage","emea-prod","apac-stage","apac-prod"]'),
          inputs.ENVIRONMENT)
        run: |
          FILE_PATH="${{ github.workspace }}/tech-enablement/config/docker.k8.yml"
          echo "Pre Replace"
          grep SERVICE_HOST "$FILE_PATH" || true

          grep "SERVICE_HOST" "$FILE_PATH" | grep "svc" | grep -v auth-svc | while read -r line; do
            service_name=$(echo "$line" | sed -n 's/.*SERVICE_HOST: "\(.*-svc\)".*/\1/p')
            pattern="SERVICE_HOST: \"$service_name\""
            replacement="SERVICE_HOST: \"$service_name-${{ env.K8S_SUFFIX }}\""
            sed -e "s/$pattern/$replacement/g" -i "$FILE_PATH"
          done

          echo -e "\nPost Replace"
          grep SERVICE_HOST "$FILE_PATH" || true

      # -----------------------------------------------------------------------
      # 9. Set replicas to 2 for non-lower environments
      # -----------------------------------------------------------------------
      - name: Set replicas to 2 (higher environments)
        run: |
          SVC_REPLICAS=(
            "concourse-appintegrations-mgmt-svc"
            "concourse-auth-svc"
            "concourse-chat-svc"
            "concourse-deliverables-svc"
            "concourse-deliverymap-svc"
            "concourse-digital-assets-svc"
            "concourse-engagement-svc"
            "concourse-integration-ai-svc"
            "concourse-integration-ipaas-svc"
            "concourse-integration-jira-svc"
            "concourse-integration-miro-svc"
            "concourse-integration-ms365-sharepoint-svc"
            "concourse-integration-provision-svc"
            "concourse-integration-pwcinternal-svc"
            "concourse-notification-svc"
            "concourse-notificationserver-svc"
            "concourse-pursuit-scope-svc"
            "concourse-raid-svc"
            "concourse-reports-svc"
            "concourse-user-profile-svc"
            "concourse-estimation-models-svc"
          )
          LOWER_ENVS=("us-dev" "us-qa" "us-int")
          SVC_NAME="${{ matrix.service.name }}"
          ENV="${{ inputs.ENVIRONMENT }}"

          IS_LOWER=false
          for e in "${LOWER_ENVS[@]}"; do [[ "$ENV" == "$e" ]] && IS_LOWER=true; done

          if [[ " ${SVC_REPLICAS[*]} " =~ " ${SVC_NAME} " ]] && [ "$IS_LOWER" = false ]; then
            echo "REPLICAS=2" >> "$GITHUB_ENV"
            echo "Setting REPLICAS=2"
          else
            echo "Using default REPLICAS=1"
          fi

      # -----------------------------------------------------------------------
      # 10. Replace tokens in K8s manifests (replaces ADO replacetokens@6 task)
      # -----------------------------------------------------------------------
      - name: Replace <{VARIABLE}> tokens in manifests
        run: |
          python3 scripts/replace-tokens.py \
            "ConcourseCore/k8s/${{ matrix.service.name }}/service.yaml" \
            "${{ github.workspace }}/tech-enablement/config/docker.k8.yml" \
            "ConcourseCore/k8s/${{ matrix.service.name }}/deployment.yaml" \
            "ConcourseCore/k8s/${{ matrix.service.name }}/hpa.yaml" \
            "ConcourseCore/k8s/${{ matrix.service.name }}/configs/${{ inputs.ENVIRONMENT }}/${{ matrix.service.name }}.configmap.yaml"

      # -----------------------------------------------------------------------
      # 11. Build YAML ConfigMap (append docker.k8.yml into configmap)
      # -----------------------------------------------------------------------
      - name: Create YAML ConfigMap
        run: |
          TARGET_FILE="ConcourseCore/k8s/${{ matrix.service.name }}/configs/${{ inputs.ENVIRONMENT }}/${{ matrix.service.name }}.configmap.yaml"

          cat >> "$TARGET_FILE" <<EOF

          ---

          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: ${{ env.CONFIGMAP_YAML_NAME }}
            namespace: ${{ env.MESH_K8S_NAMESPACE }}
          data:
            config.yaml: |
          EOF

          cat "${{ github.workspace }}/tech-enablement/config/docker.k8.yml" | sed -e 's/^/    /' >> "$TARGET_FILE"

      # -----------------------------------------------------------------------
      # 12. Azure Login (replaces ADO Azure service connection)
      # -----------------------------------------------------------------------
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # -----------------------------------------------------------------------
      # 13. Set AKS context (replaces ADO K8S_SERVICE_CONNECTION)
      # -----------------------------------------------------------------------
      - name: Set AKS context
        uses: azure/aks-set-context@v4
        with:
          cluster-name: ${{ secrets.AKS_CLUSTER_NAME }}
          resource-group: ${{ secrets.AKS_RESOURCE_GROUP }}

      # -----------------------------------------------------------------------
      # 14. Deploy ConfigMap to AKS
      # -----------------------------------------------------------------------
      - name: Deploy ConfigMap
        run: |
          kubectl apply -f "ConcourseCore/k8s/${{ matrix.service.name }}/configs/${{ inputs.ENVIRONMENT }}/${{ matrix.service.name }}.configmap.yaml"

      # -----------------------------------------------------------------------
      # 15. Debug — cat the deployment manifest
      # -----------------------------------------------------------------------
      - name: Cat Deployment.yaml
        run: |
          cat "ConcourseCore/k8s/${{ matrix.service.name }}/deployment.yaml"

      # -----------------------------------------------------------------------
      # 16. Extract secret names from deployment manifest
      # -----------------------------------------------------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Python dependencies
        run: pip install -r administration/scripts/python/utilities/requirements.txt

      - name: Get secret names from deployment manifest
        id: get-secrets
        run: |
          cd administration/scripts/python/utilities
          python3 get-secrets-from-yaml.py \
            --service-name "${{ env.SERVICE_NAME }}" \
            --manifest "${{ github.workspace }}/ConcourseCore/k8s/${{ matrix.service.name }}/deployment.yaml"

      - name: Validate secret names
        run: echo "APP_SECRETS=${{ steps.get-secrets.outputs.APP_SECRETS }}"

      # -----------------------------------------------------------------------
      # 17. Fetch secrets from Azure Key Vault (replaces ADO AzureCLI@2 task)
      # -----------------------------------------------------------------------
      - name: Fetch secrets from Azure Key Vault
        run: |
          IFS=',' read -ra SECRETS <<< "${{ steps.get-secrets.outputs.APP_SECRETS }}"
          mkdir -p "${{ github.workspace }}/envs"

          for secret in "${SECRETS[@]}"; do
            secretValue=$(az keyvault secret show \
              --vault-name "${{ secrets.AZ_KEY_VAULT }}" \
              --name "$secret" \
              --query value -o tsv)

            # Convert PascalCase to snake_case
            snake_case=$(echo "$secret" | sed -r 's/([A-Z])/_\L\1/g' | sed -r 's/^_//')
            secretPath="${{ github.workspace }}/envs/$snake_case"
            rm -f "$secretPath"
            echo -n "$secretValue" > "$secretPath"
          done

      # -----------------------------------------------------------------------
      # 18. Bake Kustomize secret manifest (replaces ADO KubernetesManifest bake)
      # -----------------------------------------------------------------------
      - name: Create kustomization.yaml
        run: |
          bash scripts/bake-secretmap.sh \
            -s "${{ env.SECRETMAP_NAME }}" \
            -p "${{ github.workspace }}/envs" \
            > "${{ github.workspace }}/kustomization.yaml"

          cat "${{ github.workspace }}/kustomization.yaml"

      - name: Bake secrets with Kustomize
        run: |
          kubectl kustomize "${{ github.workspace }}/" \
            > "${{ github.workspace }}/concourse-api-secrets.yaml"
          chmod 600 "${{ github.workspace }}/concourse-api-secrets.yaml"

      # -----------------------------------------------------------------------
      # 19. Deploy Secrets to AKS
      # -----------------------------------------------------------------------
      - name: Deploy Secrets
        run: |
          kubectl apply -f "${{ github.workspace }}/concourse-api-secrets.yaml" \
            -n "${{ env.MESH_K8S_NAMESPACE }}"

      # -----------------------------------------------------------------------
      # 20. Deploy Deployment manifest to AKS
      # -----------------------------------------------------------------------
      - name: Deploy Deployment
        run: |
          kubectl apply -f "ConcourseCore/k8s/${{ matrix.service.name }}/deployment.yaml" \
            -n "${{ env.MESH_K8S_NAMESPACE }}"

      # -----------------------------------------------------------------------
      # 21. Deploy Service manifest to AKS
      # -----------------------------------------------------------------------
      - name: Deploy Service
        run: |
          kubectl apply -f "ConcourseCore/k8s/${{ matrix.service.name }}/service.yaml" \
            -n "${{ env.MESH_K8S_NAMESPACE }}"

      # -----------------------------------------------------------------------
      # 22. Deploy HPA (only for higher envs + specific services)
      # -----------------------------------------------------------------------
      - name: Deploy HPA
        if: >-
          contains(fromJson('["us-perf","us-stage","us-prod","emea-stage","emea-prod","apac-stage","apac-prod"]'),
          inputs.ENVIRONMENT) &&
          contains(fromJson('["concourse-integration-ai-svc","concourse-deliverymap-svc","concourse-engagement-svc","concourse-user-profile-svc","concourse-chat-svc"]'),
          matrix.service.name)
        run: |
          kubectl apply -f "ConcourseCore/k8s/${{ matrix.service.name }}/hpa.yaml" \
            -n "${{ env.MESH_K8S_NAMESPACE }}"

      # -----------------------------------------------------------------------
      # 23. Rolling restart (optional)
      # -----------------------------------------------------------------------
      - name: Rolling restart deployment
        if: ${{ inputs.RESTART_PODS == true }}
        run: |
          kubectl rollout restart deployment "${{ env.DEPLOYMENT_NAME }}" \
            -n "${{ env.MESH_K8S_NAMESPACE }}"

      # -----------------------------------------------------------------------
      # 24. Push WayDev deployment metadata (always runs)
      # -----------------------------------------------------------------------
      - name: Push WayDev metadata
        if: always()
        run: |
          dateTimeNow=$(date "+%Y-%m-%d %H:%M:%S")
          data=$(cat <<EOF
          {
            "name": "${{ matrix.service.name }}",
            "repository_url": "https://github.com/pwc-us-adv-digital/${{ matrix.service.name }}",
            "ref": "${{ github.ref_name }}",
            "start_date": "$dateTimeNow",
            "finished_date": "$dateTimeNow",
            "env": "${{ inputs.ENVIRONMENT }}",
            "result": "${{ job.status }}",
            "state": "finished",
            "number": "${{ github.run_id }}"
          }
          EOF
          )
          echo "$data"
          curl -s -X POST '${{ secrets.WAYDEV_API_HOST }}deployments' \
            --header 'Accept: application/json' \
            --header 'Content-Type: application/json' \
            --header 'Authorization: ${{ secrets.WAYDEV_API_KEY }}' \
            --data "$data"
