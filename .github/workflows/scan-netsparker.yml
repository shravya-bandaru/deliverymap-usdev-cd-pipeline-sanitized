# =============================================================================
# scan-netsparker.yml — Reusable GitHub Actions workflow
# Equivalent of: scan-netsparker.yaml + scan-base.yaml (ADO templates)
#
# Combined reusable workflow that handles:
#   - Optional artifact download
#   - Debug output
#   - Netsparker (Invicti) DAST scan via the official GitHub Action
#
# Called by dast-scan.yml (the main entry-point workflow).
# =============================================================================

name: Netsparker DAST Scan

on:
  workflow_call:
    inputs:
      netsparker-endpoint:
        description: "Invicti API base URL (e.g. https://www.netsparkercloud.com)"
        required: true
        type: string
      netsparker-website-id:
        description: "Invicti target website ID"
        required: true
        type: string
      netsparker-profile-id:
        description: "Invicti scan profile ID"
        required: true
        type: string
      scan-type:
        description: "Scan type (FullWithPrimaryProfile, FullWithSelectedProfile, Incremental, Recan)"
        required: false
        type: string
        default: "FullWithSelectedProfile"
      severity:
        description: "Fail-on severity level (DoNotFail, Critical, High, Medium, Low, BestPractice)"
        required: false
        type: string
        default: "DoNotFail"
      download-artifacts:
        description: "Download build artifacts before scanning"
        required: false
        type: boolean
        default: false
      artifact-name:
        description: "Name of the artifact to download"
        required: false
        type: string
        default: "Build"
      timeout-minutes:
        description: "Job timeout in minutes"
        required: false
        type: number
        default: 480
      job-name:
        description: "Display name for the job"
        required: false
        type: string
        default: "netsparker-dast-scan"
      debug:
        description: "Enable debug output"
        required: false
        type: boolean
        default: false
    secrets:
      NETSPARKER_USER_ID:
        required: true
      NETSPARKER_API_TOKEN:
        required: true

jobs:
  netsparker-scan:
    name: ${{ inputs.job-name }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}

    steps:
      # ======================== DEBUG ========================
      - name: Debug — Print configuration
        if: inputs.debug
        run: |
          echo "===== Netsparker Scan Configuration ====="
          echo "Job Name:            ${{ inputs.job-name }}"
          echo "Timeout:             ${{ inputs.timeout-minutes }} minutes"
          echo "Endpoint:            ${{ inputs.netsparker-endpoint }}"
          echo "Website ID:          ${{ inputs.netsparker-website-id }}"
          echo "Profile ID:          ${{ inputs.netsparker-profile-id }}"
          echo "Scan Type:           ${{ inputs.scan-type }}"
          echo "Severity:            ${{ inputs.severity }}"
          echo "Download Artifacts:  ${{ inputs.download-artifacts }}"
          echo "============================================"

      # =================== ARTIFACT DOWNLOAD ===================
      - name: Download build artifacts
        if: inputs.download-artifacts
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ github.workspace }}

      # =================== CHECKOUT ============================
      - name: Checkout repository
        uses: actions/checkout@v4

      # =================== NETSPARKER SCAN ===================
      # Uses the official Netsparker GitHub Action — direct equivalent
      # of the ADO netsparker-cloud@1 task. The action handles scan
      # launching, polling, result evaluation, and reporting internally.
      - name: Run Netsparker DAST Scan
        uses: netsparker/Netsparker-Cloud-GitHub-Actions@v1.0.1
        with:
          website-id: ${{ inputs.netsparker-website-id }}
          profile-id: ${{ inputs.netsparker-profile-id }}
          api-token: ${{ secrets.NETSPARKER_API_TOKEN }}
          user-id: ${{ secrets.NETSPARKER_USER_ID }}
          base-url: ${{ inputs.netsparker-endpoint }}
          scan-type: ${{ inputs.scan-type }}
          fail-on-level: ${{ inputs.severity }}
