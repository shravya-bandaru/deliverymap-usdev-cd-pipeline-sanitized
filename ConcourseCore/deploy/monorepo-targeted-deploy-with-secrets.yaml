---
name: ${{ parameters.ENVIRONMENT }}

parameters:
  - name: ENVIRONMENT
    displayName: ENVIRONMENT
    type: string
    default: us-dev
    values:
      - us-dev
      - us-qa
      - us-perf
      - us-int
      - us-stage
      - us-prod
      - us-prod-dr
      - emea-stage
      - emea-prod
      - emea-prod-dr
      - apac-stage
      - apac-prod
      - apac-prod-dr

  - name: ASB_QUEUE_SUFFIX
    type: string
    default: ' '
    values: [' ', '-2']

  - name: EVENTHUB_CONSUMER_GROUP
    type: string
    default: ConsumerGroup1
    values: [ConsumerGroup1, ConsumerGroup2]

  - name: RELEASE_LABEL
    type: string
    default: ''

  - name: service
    type: object
    default:
      - name: concourse-appintegrations-mgmt-svc
        shortName: appintegrationsmgmt
        contextPath: appintegrations-mgmt
        buildId: 2.11.90-main-2025-05-13.1290.1
        concourseCoreConfigBranch: develop
        techEnablementConfigBranch: main

      - name: concourse-auth-svc
        shortName: auth
        contextPath: auth
        buildId: 2.11.90-main-2025-05-13.1290.1
        concourseCoreConfigBranch: develop
        techEnablementConfigBranch: main

      - name: concourse-chat-svc
        shortName: chat
        contextPath: chat
        buildId: 2.11.90-main-2025-05-13.1290.1
        concourseCoreConfigBranch: develop
        techEnablementConfigBranch: main

      - name: concourse-deliverables-svc
        shortName: deliverables
        contextPath: deliverables
        buildId: 2.11.90-main-2025-05-13.1290.1
        concourseCoreConfigBranch: develop
        techEnablementConfigBranch: main

      - name: concourse-deliverymap-svc
        shortName: deliverymap
        contextPath: deliverymap
        buildId: 2.12.6-feature.1-add-missing-attr.1-2025-05-20.1394.1
        concourseCoreConfigBranch: develop
        techEnablementConfigBranch: main

      - name: concourse-digital-assets-svc
        shortName: digitalAssets
        contextPath: digitalAssets
        buildId: 2.11.92-main-2025-05-13.1292.1
        concourseCoreConfigBranch: develop
        techEnablementConfigBranch: main

      - name: concourse-engagement-svc
        shortName: engagement
        contextPath: engagement
        buildId: 2.11.110-main-2025-05-14.1337.1
        concourseCoreConfigBranch: develop
        techEnablementConfigBranch: main

      - name: concourse-integration-ipaas-svc
        shortName: ipaas
        contextPath: ipaas
        buildId: 2.12.5-main-2025-05-16.1386.1
        concourseCoreConfigBranch: develop
        techEnablementConfigBranch: main

      - name: concourse-integration-jira-svc
        shortName: jira
        contextPath: jira
        buildId: 2.11.90-main-2025-05-13.1290.1
        concourseCoreConfigBranch: develop
        techEnablementConfigBranch: main

      - name: concourse-integration-miro-svc
        shortName: integrationmiro
        contextPath: miro-integration
        buildId: 2.11.90-main-2025-05-13.1290.1
        concourseCoreConfigBranch: develop
        techEnablementConfigBranch: main

      - name: concourse-integration-ms365-sharepoint-svc
        shortName: ms365
        contextPath: ms365-sharepoint
        buildId: 2.11.105-main-2025-05-14.1325.1
        concourseCoreConfigBranch: develop
        techEnablementConfigBranch: main

      - name: concourse-integration-pwcinternal-svc
        shortName: integrationpwcinternal
        contextPath: pwcinternal
        buildId: 2.11.90-main-2025-05-13.1290.1
        concourseCoreConfigBranch: develop
        techEnablementConfigBranch: main

      - name: concourse-integration-provision-svc
        shortName: integrationprovision
        contextPath: provision
        buildId: 2.11.99-main-2025-05-14.1315.1
        concourseCoreConfigBranch: develop
        techEnablementConfigBranch: main

      - name: concourse-notification-svc
        shortName: notification
        contextPath: notification
        buildId: 2.11.90-main-2025-05-13.1290.1
        concourseCoreConfigBranch: develop
        techEnablementConfigBranch: main

      - name: concourse-pursuit-scope-svc
        shortName: pursuitscope
        contextPath: pursuit-scope
        buildId: 2.12.6-main-2025-05-20.1390.1
        concourseCoreConfigBranch: develop
        techEnablementConfigBranch: main

      - name: concourse-raid-svc
        shortName: raid
        contextPath: raid
        buildId: 2.12.1-2025-05-19.1387.1
        concourseCoreConfigBranch: develop
        techEnablementConfigBranch: main

      - name: concourse-reports-svc
        shortName: reports
        contextPath: reports
        buildId: 2.11.93-main-2025-05-13.1296.1
        concourseCoreConfigBranch: develop
        techEnablementConfigBranch: main

      - name: concourse-user-profile-svc
        shortName: user
        contextPath: user-profile
        buildId: 2.11.90-main-2025-05-13.1290.1
        concourseCoreConfigBranch: develop
        techEnablementConfigBranch: main

      - name: concourse-estimation-models-svc
        shortName: estimationmodels
        contextPath: estimation-models
        buildId: 2.12.3-main-2025-05-15.1350.1
        concourseCoreConfigBranch: develop
        techEnablementConfigBranch: main

  - name: promoteFromDev
    type: boolean
    default: false

  - name: RESTART_PODS
    type: boolean
    default: false

  - name: agentPool
    values: [dds-concourse-ubuntu2004-01]
    default: dds-concourse-ubuntu2004-01

variables:
  - group: ConcourseCore
  - group: ${{ parameters.ENVIRONMENT }}
  - name: ENVIRONMENT
    value: ${{ parameters.ENVIRONMENT }}
  - name: MESH_K8S_NAMESPACE
    value: co-mesh
  - name: ASB_QUEUE_SUFFIX
    value: ${{ parameters.ASB_QUEUE_SUFFIX }}
  - name: EVENTHUB_CONSUMER_GROUP
    ? ${{ if in(parameters.ENVIRONMENT, 'us-stage', 'us-prod', 'emea-stage', 'emea-prod', 'apac-stage', 'apac-prod') }}
    : value: ${{ parameters.EVENTHUB_CONSUMER_GROUP }}
    ${{ else }}:
      value: $Default
  - name: REPLICAS
    value: '1'
  - name: RELEASE_LABEL
    value: ${{ parameters.RELEASE_LABEL }}
  - name: K8S_SUFFIX
    value: $[lower(replace(variables['RELEASE_LABEL'], '.', '-'))]

pr:
  branches:
    include: [noTrigger]
trigger: none

resources:
  repositories:
    - repository: AzureTemplates
      type: git
      name: InfraDevOps/ado-templates
      ref: refs/heads/master

    - repository: administration
      type: git
      name: ConcourseCore/administration
      ref: refs/heads/main

    - repository: microserviceConfig
      type: github
      endpoint: pwc-us-adv-tech-enablement
      name: pwc-us-adv-tech-enablement/tech-enablement
      ref: refs/heads/main

stages:
  - stage: deploy
    variables:
      - group: ${{ parameters.ENVIRONMENT }}
    jobs:
      - ${{ each service in parameters.service }}:
          - deployment: ${{ service.shortName }}
            pool:
              name: ${{ parameters.agentPool }}
            workspace:
              clean: all
            environment: $(ENVIRONMENT)
            variables:
              - name: ver
                value: ${{ service.buildId }}
              - name: SERVICE_NAME
                value: ${{ service.name }}
              - name: CONFIGMAP_NAME
                ? ${{ if in(parameters.ENVIRONMENT, 'us-stage', 'us-prod', 'emea-stage', 'emea-prod', 'apac-stage', 'apac-prod') }}
                : value: ${{ service.name }}-$(K8S_SUFFIX)-configmap
                ${{ else }}:
                  value: ${{ service.name }}-configmap
              - name: DEPLOYMENT_NAME
                ? ${{ if in(parameters.ENVIRONMENT, 'us-stage', 'us-prod', 'emea-stage', 'emea-prod', 'apac-stage', 'apac-prod') }}
                : value: ${{ service.name }}-$(K8S_SUFFIX)
                ${{ else }}:
                  value: ${{ service.name }}
              - name: SECRETMAP_NAME
                ? ${{ if in(parameters.ENVIRONMENT, 'us-stage', 'us-prod', 'emea-stage', 'emea-prod', 'apac-stage', 'apac-prod') }}
                : value: ${{ service.name }}-$(K8S_SUFFIX)-secretmap
                ${{ else }}:
                  value: ${{ service.name }}-secretmap
              - name: CONFIGMAP_YAML_NAME
                ? ${{ if in(parameters.ENVIRONMENT, 'us-stage', 'us-prod', 'emea-stage', 'emea-prod', 'apac-stage', 'apac-prod') }}
                : value: ${{ service.name }}-$(K8S_SUFFIX)-yaml
                ${{ else }}:
                  value: ${{ service.name }}-yaml
              - name: SERVICE_HOST_SUFFIX
                ? ${{ if in(parameters.ENVIRONMENT, 'us-stage', 'us-prod', 'emea-stage', 'emea-prod', 'apac-stage', 'apac-prod') }}
                : value: -$(K8S_SUFFIX)
                ${{ else }}:
                  value: ' '
              - name: K8S_RELEASE_LABEL
                ? ${{ if in(parameters.ENVIRONMENT, 'us-stage', 'us-prod', 'emea-stage', 'emea-prod', 'apac-stage', 'apac-prod') }}
                : value: 'release: ${{ parameters.RELEASE_LABEL }}'
                ${{ else }}:
                  value: ' '

            strategy:
              runOnce:
                deploy:
                  steps:
                    - checkout: self
                      clean: true
                      persistCredentials: true
                      displayName: Checkout ConcourseCore

                    - checkout: microserviceConfig
                      path: s/microserviceConfig
                      persistCredentials: true
                      clean: true
                      displayName: Checkout Tech-Enablement

                    - checkout: administration
                      path: s/administration
                      persistCredentials: true
                      clean: true
                      displayName: Checkout Administration

                    - script: |
                        # if configBranch is set, set both target branches to it
                        if [ ! -z "${{ service.configBranch }}" ]; then
                          echo "##vso[task.setvariable variable=techEnablementConfigBranch]${{ service.configBranch }}"
                          echo "##vso[task.setvariable variable=concourseCoreConfigBranch]${{ service.configBranch }}"

                        # else if configBranch is not set
                        else
                          # if techEnablementConfigBranch and concourseCoreConfigBranch are BOTH set, set the appropriate vars
                          if [ ! -z "${{ service.techEnablementConfigBranch }}" ] && [ ! -z "${{ service.concourseCoreConfigBranch }}" ]; then
                            echo "##vso[task.setvariable variable=techEnablementConfigBranch]${{ service.techEnablementConfigBranch }}"
                            echo "##vso[task.setvariable variable=concourseCoreConfigBranch]${{ service.concourseCoreConfigBranch }}"

                          # if techEnablementConfigBranch IS set, but concourseCoreConfigBranch is NOT set, 
                          # default concourseCoreConfigBranch to develop
                          elif [ ! -z "${{ service.techEnablementConfigBranch }}" ] && [ -z "${{ service.concourseCoreConfigBranch }}" ]; then
                            echo "service.configBranch not set & service.concourseCoreConfigBranch not set,"
                            echo " defaulting concourseCoreConfigBranch to develop"
                            echo "##vso[task.setvariable variable=techEnablementConfigBranch]${{ service.techEnablementConfigBranch }}"
                            echo "##vso[task.setvariable variable=concourseCoreConfigBranch]develop"

                          # if techEnablementConfigBranch is NOT set, but concourseCoreConfigBranch is set, 
                          # default techEnablementConfigBranch to main
                          elif [ -z "${{ service.techEnablementConfigBranch }}" ] && [ ! -z "${{ service.concourseCoreConfigBranch }}" ]; then
                            echo "service.configBranch not set & service.techEnablementConfigBranch not set," 
                            echo "defaulting techEnablementConfigBranch to main"
                            echo "##vso[task.setvariable variable=techEnablementConfigBranch]main"
                            echo "##vso[task.setvariable variable=concourseCoreConfigBranch]${{ service.concourseCoreConfigBranch }}"

                          # if missing all vars error out
                          else
                            echo "service.configBranch is not set for ${{service.name}}"
                            echo "when not set it requires one or both of service.techEnablementConfigBranch and "
                            echo "service.techEnablementConfigBranch to be set"
                            exit 1
                          fi
                        fi
                      displayName: Validate & Set Branch Targets

                    - script: |
                        pwd
                        git config --global user.email "you@example.com"
                        git config --global user.name "Azure DevOps"
                        git pull
                        git fetch --all
                        git checkout "$(concourseCoreConfigBranch)"
                      displayName: Switch ConcourseCore Branch (kube config) $(concourseCoreConfigBranch)
                      workingDirectory: $(Pipeline.Workspace)/s/ConcourseCore

                    - script: |
                        git fetch --all
                        git switch "$(techEnablementConfigBranch)"
                      displayName: Switch Tech-Enablement Branch (for docker.k8.yml)
                        - "$(techEnablementConfigBranch)"
                      workingDirectory: $(Pipeline.Workspace)/s/microserviceConfig

                    - script: echo "##vso[build.updatebuildnumber]${{ parameters.ENVIRONMENT }}
                        - $(Build.SourceBranchName)"
                      displayName: Show runtime Parameters

                    - script: |
                        curl https://concourse-api-qa.pwc.com/v3/${{ service.contextPath }}/health
                        BUILD_ID_RESPONSE=$(curl https://concourse-api-qa.pwc.com/v3/${{service.contextPath}}/health)
                        BUILD_ID=$(echo $BUILD_ID_RESPONSE |jq  -r '.metadata.appVersion'|sed 's/.202/-202/g')
                        echo "BUILD_ID: $(BUILD_ID)"
                        echo "##vso[task.setvariable variable=ver;]${BUILD_ID}"
                      displayName: Get Versions From Dev
                      condition: and(succeeded(), eq('${{ parameters.promoteFromDev }}',
                        true))

                    - script: |
                        cp -v ConcourseCore/k8s/microservice-template/service.yaml ConcourseCore/k8s/${{service.name}}/service.yaml
                      displayName: Copy Manifest Templates

                    - script: |
                        # File to read
                        FILE_PATH=$(Pipeline.Workspace)/s/microserviceConfig/config/docker.k8.yml

                        echo Pre Replace
                        grep SERVICE_HOST $FILE_PATH

                        # Extract lines containing SERVICE_HOST and svc
                        grep "SERVICE_HOST" $FILE_PATH | grep "svc" | grep -v auth-svc | while read -r line; do
                            # Extract the service name from the line
                            service_name=$(echo "$line" | sed -n 's/.*SERVICE_HOST: "\(.*-svc\)".*/\1/p')
                            
                            # Construct the pattern to be replaced
                            pattern="SERVICE_HOST: \"$service_name\""
                            
                            # Construct the replacement with the suffix
                            replacement="SERVICE_HOST: \"$service_name-${K8S_SUFFIX}\""
                            
                            # Run sed to replace the pattern with the replacement in the file
                            sed -e "s/$pattern/$replacement/g" -i $FILE_PATH
                        done
                        echo -e "\nPost Replace"
                        grep SERVICE_HOST $FILE_PATH
                      condition: or( eq(variables['ENVIRONMENT'], 
                        'us-stage'), eq(variables['ENVIRONMENT'], 'us-prod'), eq(variables['ENVIRONMENT'],
                        'emea-stage'), eq(variables['ENVIRONMENT'], 'emea-prod'),
                        eq(variables['ENVIRONMENT'], 'apac-stage'), eq(variables['ENVIRONMENT'],
                        'apac-prod') )
                      displayName: Update SERVICE_HOST

                    - bash: |
                        echo Service name ${{ service.name }}
                        SVC_REPLICAS=(
                         "concourse-appintegrations-mgmt-svc" 
                         "concourse-auth-svc" 
                         "concourse-chat-svc" 
                         "concourse-deliverables-svc" 
                         "concourse-deliverymap-svc" 
                         "concourse-digital-assets-svc" 
                         "concourse-engagement-svc" 
                         "concourse-integration-ai-svc" 
                         "concourse-integration-ipaas-svc" 
                         "concourse-integration-jira-svc" 
                         "concourse-integration-miro-svc" 
                         "concourse-integration-ms365-sharepoint-svc"
                         "concourse-integration-provision-svc"
                         "concourse-integration-pwcinternal-svc" 
                         "concourse-notification-svc" 
                         "concourse-notificationserver-svc" 
                         "concourse-pursuit-scope-svc" 
                         "concourse-raid-svc" 
                         "concourse-reports-svc" 
                         "concourse-user-profile-svc"
                         "concourse-estimation-models-svc"
                        )
                        LOWER_ENVS=("us-dev" "us-qa" "us-int")
                        if [[ "${SVC_REPLICAS[@]}" =~ "${{ service.name }}" ]] && ! [[ "${LOWER_ENVS[@]}" =~ "${{parameters.ENVIRONMENT}}" ]]; then
                          echo "##vso[task.setvariable variable=REPLICAS]2"
                          echo REPLICAS 2
                        else :
                          echo "Skip using global scope replicas"
                        fi
                      displayName: Set Replicas to 2

                    - task: qetza.replacetokens.replacetokens-task.replacetokens@6
                      displayName: Replace Tokens
                      inputs:
                        targetFiles: |
                          ConcourseCore/k8s/${{ service.name }}/service.yaml
                          $(Pipeline.Workspace)/s/microserviceConfig/config/docker.k8.yml
                          ConcourseCore/k8s/${{ service.name }}/deployment.yaml
                          ConcourseCore/k8s/${{ service.name }}/hpa.yaml
                          ConcourseCore/k8s/${{ service.name }}/configs/${{parameters.ENVIRONMENT}}/${{ service.name }}.configmap.yaml
                        encoding: auto
                        tokenPattern: custom
                        tokenPrefix: <{
                        tokenSuffix: '}>'
                        writeBOM: true
                        actionOnMissing: warn
                        keepToken: false
                        actionOnNoFiles: continue
                        enableTransforms: false
                        enableRecursion: false
                        useLegacyPattern: false
                        enableTelemetry: true
                        defaultValue: defaultValue
                        verbosity: detailed

                    - bash: |
                        echo "
                        ---

                        apiVersion: v1
                        kind: ConfigMap
                        metadata:
                          name: $(CONFIGMAP_YAML_NAME)
                          namespace: $(MESH_K8S_NAMESPACE)
                        data:
                          config.yaml: |
                        " >> ConcourseCore/k8s/${{ service.name }}/configs/${{parameters.ENVIRONMENT}}/${{ service.name }}.configmap.yaml

                        TARGET_FILE="ConcourseCore/k8s/${{ service.name }}/configs/${{parameters.ENVIRONMENT}}/${{service.name}}.configmap.yaml"
                        cat $(Pipeline.Workspace)/s/microserviceConfig/config/docker.k8.yml | sed  -e 's/^/    /' >> $TARGET_FILE

                      displayName: createYamlConfig

                    - task: KubernetesManifest@1
                      displayName: Create Configmap
                      inputs:
                        kubernetesServiceConnection: $(K8S_SERVICE_CONNECTION)
                        namespace: $(MESH_K8S_NAMESPACE)
                        action: deploy
                        manifests: ConcourseCore/k8s/${{ service.name }}/configs/${{parameters.ENVIRONMENT}}/${{
                          service.name }}.configmap.yaml

                    - script: |
                        cat "ConcourseCore/k8s/${{ service.name }}/deployment.yaml"
                      displayName: Cat Deployment.yaml

                    - script: |
                        sudo apt update
                        sudo apt install software-properties-common
                        sudo apt install python3.8
                        python3.8 -V
                        python3.8 -m pip install --upgrade pip
                        python3.8 -m pip install -qr $(Build.SourcesDirectory)/administration/scripts/python/utilities/requirements.txt
                        cd $(Build.SourcesDirectory)/administration/scripts/python/utilities
                        python3.8 get-secrets-from-yaml.py --service-name $(SERVICE_NAME) \
                          --manifest "$(Build.SourcesDirectory)/ConcourseCore/k8s/${{ service.name }}/deployment.yaml"
                      displayName: Get Secrets Names

                    - script: |
                        echo $(APP_SECRETS)
                      displayName: Validate secrets names

                    - task: AzureCLI@2
                      displayName: Get AKV Secrets AZ CLI
                      inputs:
                        azureSubscription: $(AZURE_SERVICE_CONNECTION)
                        scriptType: bash
                        scriptLocation: inlineScript
                        inlineScript: |
                          IFS=',' read -ra SECRETS <<< "$APP_SECRETS"
                          mkdir -p "$(System.DefaultWorkingDirectory)/envs"

                          for secret in "${SECRETS[@]}"; do
                            secretValue=$(az keyvault secret show --vault-name "$AZ_KEY_VAULT" --name "$secret" --query value -o tsv)

                            # Convert PascalCase to snake_case
                            snake_case=$(echo "$secret" | sed -r 's/([A-Z])/_\L\1/g' | sed -r 's/^_//')

                            secretPath="$(System.DefaultWorkingDirectory)/envs/$snake_case"
                            rm -vf $secretPath

                            if [ ! -f "$secretPath" ]; then
                              echo -n "$secretValue" > "$secretPath"
                            else
                              echo "Secret already exists at $secretPath"
                            fi
                          done
                        useAzureCli: true

                    - bash: |
                        bash '$(System.DefaultWorkingDirectory)/administration/scripts/bash/bake-secretmap.sh' \
                          -s $(SECRETMAP_NAME) \
                          -p '$(System.DefaultWorkingDirectory)/envs' > '$(System.DefaultWorkingDirectory)/kustomization.yaml'
                        cat '$(System.DefaultWorkingDirectory)/kustomization.yaml'
                      displayName: Create kustomize

                    - task: KubernetesManifest@1
                      name: bake
                      displayName: Bake kustomization path
                      inputs:
                        action: bake
                        renderType: kustomize
                        kustomizationPath: $(System.DefaultWorkingDirectory)/

                    - script: |
                        mv $(bake.manifestsBundle) $(System.DefaultWorkingDirectory)/concourse-api-secrets.yaml
                        chmod 600 $(System.DefaultWorkingDirectory)/concourse-api-secrets.yaml
                        ls -l $(System.DefaultWorkingDirectory)/concourse-api-secrets.yaml
                      displayName: Move file to kusto folder

                    - task: KubernetesManifest@1
                      displayName: Deploy Secrets
                      inputs:
                        kubernetesServiceConnection: $(K8S_SERVICE_CONNECTION)
                        namespace: $(MESH_K8S_NAMESPACE)
                        action: deploy
                        manifests: $(System.DefaultWorkingDirectory)/concourse-api-secrets.yaml

                    - task: KubernetesManifest@1
                      displayName: Create Deployment
                      inputs:
                        kubernetesServiceConnection: $(K8S_SERVICE_CONNECTION)
                        namespace: $(MESH_K8S_NAMESPACE)
                        action: deploy
                        manifests: |
                          ConcourseCore/k8s/${{ service.name }}/deployment.yaml

                    - task: KubernetesManifest@1
                      displayName: Create Service
                      inputs:
                        kubernetesServiceConnection: $(K8S_SERVICE_CONNECTION)
                        namespace: $(MESH_K8S_NAMESPACE)
                        action: deploy
                        manifests: ConcourseCore/k8s/${{ service.name }}/service.yaml

                    - ${{ if and(in(parameters.ENVIRONMENT, 'us-perf', 'us-stage', 'us-prod', 'emea-stage', 'emea-prod', 'apac-stage', 'apac-prod'), in(service.name,'concourse-integration-ai-svc', 'concourse-deliverymap-svc', 'concourse-engagement-svc', 'concourse-user-profile-svc', 'concourse-chat-svc')) }}:
                      - task: KubernetesManifest@1
                        displayName: Create HPA
                        inputs:
                          kubernetesServiceConnection: $(K8S_SERVICE_CONNECTION)
                          namespace: $(MESH_K8S_NAMESPACE)
                          action: deploy
                          manifests: |
                            ConcourseCore/k8s/${{ service.name }}/hpa.yaml

                    - task: Kubernetes@1
                      name: RollingRestart
                      displayName: Restarting by Deployment
                      inputs:
                        connectionType: Kubernetes Service Connection
                        kubernetesServiceEndpoint: $(K8S_SERVICE_CONNECTION)
                        namespace: $(MESH_K8S_NAMESPACE)
                        command: rollout
                        arguments: restart deployment $(DEPLOYMENT_NAME)
                        outputFormat: none
                        condition: eq(variables['RESTART_PODS'], 'true')

                    - bash: |
                        dateTimeNow=$(date "+%Y-%m-%d %H:%M:%S")
                        data="{\
                          \"name\":\"${{ service.name }}\",\
                          \"repository_url\":\"https://github.com/pwc-us-adv-digital/${{service.name}}\",\
                          \"ref\":\"$(Build.SourceBranchName)\",\
                          \"start_date\":\"$dateTimeNow\",\
                          \"finished_date\":\"$dateTimeNow\",\
                          \"env\":\"${{parameters.ENVIRONMENT}}\",\
                          \"result\":\"$(Agent.JobStatus)\",\
                          \"state\":\"finished\",\
                          \"number\":\"$(Build.BuildId)\"\
                        }"
                        echo $data
                        curl -X POST '$(WAYDEV_API_HOST)deployments' \
                        --header 'Accept: application/json' \
                        --header 'Content-Type: application/json' \
                        --header 'Authorization: $(WAYDEV_API_KEY)' \
                        --data "$data"
                      displayName: Push WayDev Metadata Success
                      condition: always()
