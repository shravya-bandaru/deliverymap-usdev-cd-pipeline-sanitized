---
name: ${{ parameters.ENVIRONMENT }}

parameters:
  - name: ENVIRONMENT
    displayName: ENVIRONMENT
    type: string
    default: us-dev
    values:
      - us-dev
      - us-qa
      - us-perf
      - us-int
      - us-stage
      - us-prod
      - us-prod-dr
      - emea-stage
      - emea-prod
      - emea-prod-dr
      - apac-stage
      - apac-prod
      - apac-prod-dr

  - name: ASB_QUEUE_SUFFIX
    type: string
    default: ' '
    values: [' ', '-2']

  - name: EVENTHUB_CONSUMER_GROUP
    type: string
    default: ConsumerGroup1
    values: [ConsumerGroup1, ConsumerGroup2]

  - name: RELEASE_LABEL
    type: string
    default: 'test'

  - name: service
    type: object
    default:
      - name: concourse-deliverymap-svc
        shortName: deliverymap
        contextPath: deliverymap
        buildId: 2.12.6-feature.1-add-missing-attr.1-2025-05-20.1394.1
        concourseCoreConfigBranch: main
        techEnablementConfigBranch: main

  - name: promoteFromDev
    type: boolean
    default: false

  - name: RESTART_PODS
    type: boolean
    default: false



variables:
  - name: ENVIRONMENT
    value: ${{ parameters.ENVIRONMENT }}
  - name: MESH_K8S_NAMESPACE
    value: co-mesh
  - name: K8S_NAMESPACE_MESH
    value: co-mesh
  - name: K8S_SERVICE_CONNECTION
    value: concourse-aks-usdev
  - name: ASB_QUEUE_SUFFIX
    value: ${{ parameters.ASB_QUEUE_SUFFIX }}
  - name: EVENTHUB_CONSUMER_GROUP
    ? ${{ if in(parameters.ENVIRONMENT, 'us-stage', 'us-prod', 'emea-stage', 'emea-prod', 'apac-stage', 'apac-prod') }}
    : value: ${{ parameters.EVENTHUB_CONSUMER_GROUP }}
    ${{ else }}:
      value: $Default
  - name: REPLICAS
    value: '1'
  - name: RELEASE_LABEL
    value: ${{ parameters.RELEASE_LABEL }}
  - name: K8S_SUFFIX
    value: $[lower(replace(variables['RELEASE_LABEL'], '.', '-'))]

pr:
  branches:
    include: [noTrigger]
trigger: none

stages:
  - stage: deploy
    jobs:
      - ${{ each service in parameters.service }}:
          - deployment: ${{ service.shortName }}
            pool:
              vmImage: ubuntu-latest
            workspace:
              clean: all
            environment: $(ENVIRONMENT)
            variables:
              - name: ver
                value: ${{ service.buildId }}
              - name: SERVICE_NAME
                value: ${{ service.name }}
              - name: CONFIGMAP_NAME
                ? ${{ if in(parameters.ENVIRONMENT, 'us-stage', 'us-prod', 'emea-stage', 'emea-prod', 'apac-stage', 'apac-prod') }}
                : value: ${{ service.name }}-$(K8S_SUFFIX)-configmap
                ${{ else }}:
                  value: ${{ service.name }}-configmap
              - name: DEPLOYMENT_NAME
                ? ${{ if in(parameters.ENVIRONMENT, 'us-stage', 'us-prod', 'emea-stage', 'emea-prod', 'apac-stage', 'apac-prod') }}
                : value: ${{ service.name }}-$(K8S_SUFFIX)
                ${{ else }}:
                  value: ${{ service.name }}
              - name: SECRETMAP_NAME
                ? ${{ if in(parameters.ENVIRONMENT, 'us-stage', 'us-prod', 'emea-stage', 'emea-prod', 'apac-stage', 'apac-prod') }}
                : value: ${{ service.name }}-$(K8S_SUFFIX)-secretmap
                ${{ else }}:
                  value: ${{ service.name }}-secretmap
              - name: CONFIGMAP_YAML_NAME
                ? ${{ if in(parameters.ENVIRONMENT, 'us-stage', 'us-prod', 'emea-stage', 'emea-prod', 'apac-stage', 'apac-prod') }}
                : value: ${{ service.name }}-$(K8S_SUFFIX)-yaml
                ${{ else }}:
                  value: ${{ service.name }}-yaml
              - name: SERVICE_HOST_SUFFIX
                ? ${{ if in(parameters.ENVIRONMENT, 'us-stage', 'us-prod', 'emea-stage', 'emea-prod', 'apac-stage', 'apac-prod') }}
                : value: -$(K8S_SUFFIX)
                ${{ else }}:
                  value: ' '
              - name: K8S_RELEASE_LABEL
                ? ${{ if in(parameters.ENVIRONMENT, 'us-stage', 'us-prod', 'emea-stage', 'emea-prod', 'apac-stage', 'apac-prod') }}
                : value: 'release: ${{ parameters.RELEASE_LABEL }}'
                ${{ else }}:
                  value: ' '

            strategy:
              runOnce:
                deploy:
                  steps:
                    - checkout: self
                      clean: true
                      persistCredentials: true
                      displayName: Checkout Monorepo

                    - bash: |
                        # if configBranch is set, set both target branches to it
                        if [ ! -z "${{ service.configBranch }}" ]; then
                          echo "##vso[task.setvariable variable=techEnablementConfigBranch]${{ service.configBranch }}"
                          echo "##vso[task.setvariable variable=concourseCoreConfigBranch]${{ service.configBranch }}"

                        # else if configBranch is not set
                        else
                          # if techEnablementConfigBranch and concourseCoreConfigBranch are BOTH set, set the appropriate vars
                          if [ ! -z "${{ service.techEnablementConfigBranch }}" ] && [ ! -z "${{ service.concourseCoreConfigBranch }}" ]; then
                            echo "##vso[task.setvariable variable=techEnablementConfigBranch]${{ service.techEnablementConfigBranch }}"
                            echo "##vso[task.setvariable variable=concourseCoreConfigBranch]${{ service.concourseCoreConfigBranch }}"

                          # if techEnablementConfigBranch IS set, but concourseCoreConfigBranch is NOT set, 
                          # default concourseCoreConfigBranch to main
                          elif [ ! -z "${{ service.techEnablementConfigBranch }}" ] && [ -z "${{ service.concourseCoreConfigBranch }}" ]; then
                            echo "service.configBranch not set & service.concourseCoreConfigBranch not set,"
                            echo " defaulting concourseCoreConfigBranch to main"
                            echo "##vso[task.setvariable variable=techEnablementConfigBranch]${{ service.techEnablementConfigBranch }}"
                            echo "##vso[task.setvariable variable=concourseCoreConfigBranch]main"

                          # if techEnablementConfigBranch is NOT set, but concourseCoreConfigBranch is set, 
                          # default techEnablementConfigBranch to main
                          elif [ -z "${{ service.techEnablementConfigBranch }}" ] && [ ! -z "${{ service.concourseCoreConfigBranch }}" ]; then
                            echo "service.configBranch not set & service.techEnablementConfigBranch not set," 
                            echo "defaulting techEnablementConfigBranch to main"
                            echo "##vso[task.setvariable variable=techEnablementConfigBranch]main"
                            echo "##vso[task.setvariable variable=concourseCoreConfigBranch]${{ service.concourseCoreConfigBranch }}"

                          # if missing all vars error out
                          else
                            echo "service.configBranch is not set for ${{service.name}}"
                            echo "when not set it requires one or both of service.techEnablementConfigBranch and "
                            echo "service.techEnablementConfigBranch to be set"
                            exit 1
                          fi
                        fi
                      displayName: Validate & Set Branch Targets

                    - bash: |
                        pwd
                        git config --global user.email "you@example.com"
                        git config --global user.name "Azure DevOps"
                        git fetch --all
                        git checkout -b "$(concourseCoreConfigBranch)" "origin/$(concourseCoreConfigBranch)" || git checkout "$(concourseCoreConfigBranch)"
                        git pull origin "$(concourseCoreConfigBranch)"
                      displayName: Switch ConcourseCore Branch (kube config) $(concourseCoreConfigBranch)
                      workingDirectory: $(Pipeline.Workspace)/s

                    - bash: |
                        git fetch --all
                        git switch "$(techEnablementConfigBranch)"
                      displayName: Switch Tech-Enablement Branch (for docker.k8.yml)
                        - "$(techEnablementConfigBranch)"
                      workingDirectory: $(Pipeline.Workspace)/s

                    - bash: echo "##vso[build.updatebuildnumber]${{ parameters.ENVIRONMENT }} - $(Build.SourceBranchName)"
                      displayName: Show runtime Parameters

                    - bash: |
                        curl https://concourse-api-qa.pwc.com/v3/${{ service.contextPath }}/health
                        BUILD_ID_RESPONSE=$(curl https://concourse-api-qa.pwc.com/v3/${{service.contextPath}}/health)
                        BUILD_ID=$(echo $BUILD_ID_RESPONSE |jq  -r '.metadata.appVersion'|sed 's/.202/-202/g')
                        echo "BUILD_ID: $(BUILD_ID)"
                        echo "##vso[task.setvariable variable=ver;]${BUILD_ID}"
                      displayName: Get Versions From Dev
                      condition: and(succeeded(), eq('${{ parameters.promoteFromDev }}',
                        true))

                    - bash: |
                        cp -v ConcourseCore/k8s/microservice-template/service.yaml ConcourseCore/k8s/${{service.name}}/service.yaml
                      displayName: Copy Manifest Templates

                    - bash: |
                        # File to read
                        FILE_PATH=$(Pipeline.Workspace)/s/tech-enablement/config/docker.k8.yml

                        echo Pre Replace
                        grep SERVICE_HOST $FILE_PATH

                        # Extract lines containing SERVICE_HOST and svc
                        grep "SERVICE_HOST" $FILE_PATH | grep "svc" | grep -v auth-svc | while read -r line; do
                            # Extract the service name from the line
                            service_name=$(echo "$line" | sed -n 's/.*SERVICE_HOST: "\(.*-svc\)".*/\1/p')
                            
                            # Construct the pattern to be replaced
                            pattern="SERVICE_HOST: \"$service_name\""
                            
                            # Construct the replacement with the suffix
                            replacement="SERVICE_HOST: \"$service_name-${K8S_SUFFIX}\""
                            
                            # Run sed to replace the pattern with the replacement in the file
                            sed -e "s/$pattern/$replacement/g" -i $FILE_PATH
                        done
                        echo -e "\nPost Replace"
                        grep SERVICE_HOST $FILE_PATH
                      condition: or( eq(variables['ENVIRONMENT'], 
                        'us-stage'), eq(variables['ENVIRONMENT'], 'us-prod'), eq(variables['ENVIRONMENT'],
                        'emea-stage'), eq(variables['ENVIRONMENT'], 'emea-prod'),
                        eq(variables['ENVIRONMENT'], 'apac-stage'), eq(variables['ENVIRONMENT'],
                        'apac-prod') )
                      displayName: Update SERVICE_HOST

                    - bash: |
                        echo Service name ${{ service.name }}
                        SVC_REPLICAS=(
                         "concourse-appintegrations-mgmt-svc" 
                         "concourse-auth-svc" 
                         "concourse-chat-svc" 
                         "concourse-deliverables-svc" 
                         "concourse-deliverymap-svc" 
                         "concourse-digital-assets-svc" 
                         "concourse-engagement-svc" 
                         "concourse-integration-ai-svc" 
                         "concourse-integration-ipaas-svc" 
                         "concourse-integration-jira-svc" 
                         "concourse-integration-miro-svc" 
                         "concourse-integration-ms365-sharepoint-svc"
                         "concourse-integration-provision-svc"
                         "concourse-integration-pwcinternal-svc" 
                         "concourse-notification-svc" 
                         "concourse-notificationserver-svc" 
                         "concourse-pursuit-scope-svc" 
                         "concourse-raid-svc" 
                         "concourse-reports-svc" 
                         "concourse-user-profile-svc"
                         "concourse-estimation-models-svc"
                        )
                        LOWER_ENVS=("us-dev" "us-qa" "us-int")
                        if [[ "${SVC_REPLICAS[@]}" =~ "${{ service.name }}" ]] && ! [[ "${LOWER_ENVS[@]}" =~ "${{parameters.ENVIRONMENT}}" ]]; then
                          echo "##vso[task.setvariable variable=REPLICAS]2"
                          echo REPLICAS 2
                        else :
                          echo "Skip using global scope replicas"
                        fi
                      displayName: Set Replicas to 2

                    - bash: |
                        TARGET_FILES=(
                          "ConcourseCore/k8s/${{ service.name }}/service.yaml"
                          "$(Pipeline.Workspace)/s/tech-enablement/config/docker.k8.yml"
                          "ConcourseCore/k8s/${{ service.name }}/deployment.yaml"
                          "ConcourseCore/k8s/${{ service.name }}/hpa.yaml"
                          "ConcourseCore/k8s/${{ service.name }}/configs/${{parameters.ENVIRONMENT}}/${{ service.name }}.configmap.yaml"
                        )
                        for file in "${TARGET_FILES[@]}"; do
                          if [ -f "$file" ]; then
                            echo "Processing: $file"
                            tokens=$(grep -oP '<\{[^}]+\}>' "$file" | sort -u | sed 's/<{//;s/}>//')
                            for token in $tokens; do
                              value="${!token}"
                              if [ -n "$value" ]; then
                                sed -i "s|<{${token}}>|${value}|g" "$file"
                              else
                                echo "WARNING: No value for token: $token, using defaultValue"
                                sed -i "s|<{${token}}>|defaultValue|g" "$file"
                              fi
                            done
                          else
                            echo "File not found, skipping: $file"
                          fi
                        done
                      displayName: Replace Tokens

                    - bash: |
                        echo "
                        ---

                        apiVersion: v1
                        kind: ConfigMap
                        metadata:
                          name: $(CONFIGMAP_YAML_NAME)
                          namespace: $(MESH_K8S_NAMESPACE)
                        data:
                          config.yaml: |
                        " >> ConcourseCore/k8s/${{ service.name }}/configs/${{parameters.ENVIRONMENT}}/${{ service.name }}.configmap.yaml

                        TARGET_FILE="ConcourseCore/k8s/${{ service.name }}/configs/${{parameters.ENVIRONMENT}}/${{service.name}}.configmap.yaml"
                        cat $(Pipeline.Workspace)/s/tech-enablement/config/docker.k8.yml | sed  -e 's/^/    /' >> $TARGET_FILE

                      displayName: createYamlConfig

                    - task: KubernetesManifest@1
                      displayName: Create Configmap
                      inputs:
                        kubernetesServiceConnection: $(K8S_SERVICE_CONNECTION)
                        namespace: $(MESH_K8S_NAMESPACE)
                        action: deploy
                        manifests: ConcourseCore/k8s/${{ service.name }}/configs/${{parameters.ENVIRONMENT}}/${{
                          service.name }}.configmap.yaml

                    - bash: |
                        cat "ConcourseCore/k8s/${{ service.name }}/deployment.yaml"
                      displayName: Cat Deployment.yaml

                    - task: KubernetesManifest@1
                      displayName: Create Deployment
                      inputs:
                        kubernetesServiceConnection: $(K8S_SERVICE_CONNECTION)
                        namespace: $(MESH_K8S_NAMESPACE)
                        action: deploy
                        manifests: |
                          ConcourseCore/k8s/${{ service.name }}/deployment.yaml

                    - task: KubernetesManifest@1
                      displayName: Create Service
                      inputs:
                        kubernetesServiceConnection: $(K8S_SERVICE_CONNECTION)
                        namespace: $(MESH_K8S_NAMESPACE)
                        action: deploy
                        manifests: ConcourseCore/k8s/${{ service.name }}/service.yaml

                    - ${{ if and(in(parameters.ENVIRONMENT, 'us-perf', 'us-stage', 'us-prod', 'emea-stage', 'emea-prod', 'apac-stage', 'apac-prod'), in(service.name,'concourse-integration-ai-svc', 'concourse-deliverymap-svc', 'concourse-engagement-svc', 'concourse-user-profile-svc', 'concourse-chat-svc')) }}:
                      - task: KubernetesManifest@1
                        displayName: Create HPA
                        inputs:
                          kubernetesServiceConnection: $(K8S_SERVICE_CONNECTION)
                          namespace: $(MESH_K8S_NAMESPACE)
                          action: deploy
                          manifests: |
                            ConcourseCore/k8s/${{ service.name }}/hpa.yaml

                    - task: Kubernetes@1
                      name: RollingRestart
                      displayName: Restarting by Deployment
                      inputs:
                        connectionType: Kubernetes Service Connection
                        kubernetesServiceEndpoint: $(K8S_SERVICE_CONNECTION)
                        namespace: $(MESH_K8S_NAMESPACE)
                        command: rollout
                        arguments: restart deployment $(DEPLOYMENT_NAME)
                        outputFormat: none
                        condition: eq(variables['RESTART_PODS'], 'true')


